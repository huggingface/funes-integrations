name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  bundles:
    name: Bundle tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        id: [claude, codex, hermes, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each bundle's own suite: its converter, its setup and its hooks, driven against fakes.
      - name: Test the bundle
        run: sh "${{ matrix.id }}/test/run.sh"

  # The bundles that run on native Windows, where funes runs each `setup.ps1` with Windows
  # PowerShell, and each suite runs the same way. Hermes does not run there.
  bundles-windows:
    name: Bundle tests on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        id: [claude, codex, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's TEMP spells its profile directory by the 8.3 short name, where a path a program
      # resolves itself is spelled in full: the tests' temporary files go in the runner's own.
      - name: Test the bundle
        shell: powershell
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "${{ matrix.id }}/test/run.ps1"

  hf-traces:
    name: hf-traces converter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The converter reads parquet through pyarrow, which the runner's Python does not carry.
      - name: Test the converter
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyarrow==26.0.0
          PYTHON="$RUNNER_TEMP/venv/bin/python" sh hf-traces/test/run.sh
